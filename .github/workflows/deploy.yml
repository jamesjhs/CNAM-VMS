name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build deployment artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect optional scripts
        id: scripts
        shell: bash
        run: |
          has_script() {
            node -e "const name = process.argv[2]; const scripts = require('./package.json').scripts || {}; process.exit(scripts[name] ? 0 : 1)" "$1"
          }

          if has_script lint; then
            echo "run_lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_lint=false" >> "$GITHUB_OUTPUT"
          fi

          if has_script typecheck; then
            echo "run_typecheck=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_typecheck=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        if: steps.scripts.outputs.run_lint == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.scripts.outputs.run_typecheck == 'true'
        run: npm run typecheck

      - name: Generate ephemeral build secrets
        id: build-secrets
        shell: bash
        run: |
          set -euo pipefail
          BUILD_AUTH_SECRET="$(openssl rand -base64 32)"
          BUILD_DB_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          echo "::add-mask::$BUILD_AUTH_SECRET"
          echo "::add-mask::$BUILD_DB_ENCRYPTION_KEY"
          echo "BUILD_AUTH_SECRET=$BUILD_AUTH_SECRET" >> "$GITHUB_ENV"
          echo "BUILD_DB_ENCRYPTION_KEY=$BUILD_DB_ENCRYPTION_KEY" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ${{ env.BUILD_AUTH_SECRET }}
          AUTH_URL: https://cnamvms.jahosi.co.uk
          DATABASE_URL: file:/var/node/cnamvms.jahosi.co.uk-3001/shared/data/cnam-vms.db
          DB_ENCRYPTION_KEY: ${{ env.BUILD_DB_ENCRYPTION_KEY }}
          ROOT_USER_EMAIL: ci@example.com
          ROOT_USER_NAME: CI Root
          UPLOAD_DIR: /var/node/cnamvms.jahosi.co.uk-3001/shared/uploads

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="release"
          ARTIFACT_NAME="cnam-vms-${GITHUB_SHA}.tar.gz"

          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT/.next"

          cp -R .next/standalone "$ARTIFACT_ROOT/.next/standalone"
          cp -R .next/static "$ARTIFACT_ROOT/.next/static"
          cp -R public "$ARTIFACT_ROOT/public"
          cp package.json "$ARTIFACT_ROOT/package.json"
          cp ecosystem.config.cjs "$ARTIFACT_ROOT/ecosystem.config.cjs"

          # Never ship mutable/persistent data in artifacts.
          if [[ -d "$ARTIFACT_ROOT/.next/standalone/data" ]]; then
            rm -rf "$ARTIFACT_ROOT/.next/standalone/data"
            echo "Removed standalone data directory from artifact payload"
          fi

          cat > "$ARTIFACT_ROOT/REVISION" <<EOF
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_id=${GITHUB_RUN_ID}
          EOF

          tar -czf "$ARTIFACT_NAME" -C "$ARTIFACT_ROOT" .
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: ${{ env.artifact_name }}
          retention-days: 14

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: deploy-artifact
          path: .

      - name: Resolve deploy configuration
        id: deploy-config
        shell: bash
        env:
          DEPLOY_HOST_RAW: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT_RAW: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER_RAW: ${{ secrets.DEPLOY_USER != '' && secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY_RAW: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_SSH_KEY || vars.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS_RAW: ${{ secrets.DEPLOY_KNOWN_HOSTS != '' && secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          DEPLOY_HOST="$DEPLOY_HOST_RAW"
          DEPLOY_PORT="${DEPLOY_PORT_RAW:-22}"
          DEPLOY_USER="$DEPLOY_USER_RAW"
          DEPLOY_SSH_KEY="$DEPLOY_SSH_KEY_RAW"
          DEPLOY_KNOWN_HOSTS="$DEPLOY_KNOWN_HOSTS_RAW"

          echo "::add-mask::$DEPLOY_SSH_KEY"
          echo "::add-mask::$DEPLOY_KNOWN_HOSTS"

          missing=()
          [[ -n "$DEPLOY_HOST" ]] || missing+=("DEPLOY_HOST")
          [[ -n "$DEPLOY_USER" ]] || missing+=("DEPLOY_USER")
          [[ -n "$DEPLOY_SSH_KEY" ]] || missing+=("DEPLOY_SSH_KEY")
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || missing+=("DEPLOY_KNOWN_HOSTS")

          if ((${#missing[@]} > 0)); then
            printf '::error::Missing required deploy configuration: %s. Define these under GitHub Settings -> Secrets and variables -> Actions (repository or environment).\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

          if ! [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::DEPLOY_PORT must be numeric; received '$DEPLOY_PORT'."
            exit 1
          fi
          if ((DEPLOY_PORT < 1 || DEPLOY_PORT > 65535)); then
            echo "::error::DEPLOY_PORT must be between 1 and 65535; received '$DEPLOY_PORT'."
            exit 1
          fi

          if ! grep -Eq '-----BEGIN [A-Z ]*PRIVATE KEY-----' <<<"$DEPLOY_SSH_KEY"; then
            echo "::error::DEPLOY_SSH_KEY does not look like a valid private key format."
            exit 1
          fi
          if ! grep -Eq '^[^[:space:]]+[[:space:]]+[^[:space:]]+([[:space:]]+[^[:space:]]+)?$' <<<"$DEPLOY_KNOWN_HOSTS"; then
            echo "::error::DEPLOY_KNOWN_HOSTS does not look like a valid known_hosts entry structure."
            exit 1
          fi

          {
            echo "deploy_host=$DEPLOY_HOST"
            echo "deploy_port=$DEPLOY_PORT"
            echo "deploy_user=$DEPLOY_USER"
          } >> "$GITHUB_OUTPUT"

          {
            echo "deploy_ssh_key<<__DEPLOY_SSH_KEY__"
            printf '%s\n' "$DEPLOY_SSH_KEY"
            echo "__DEPLOY_SSH_KEY__"
          } >> "$GITHUB_OUTPUT"

          {
            echo "deploy_known_hosts<<__DEPLOY_KNOWN_HOSTS__"
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS"
            echo "__DEPLOY_KNOWN_HOSTS__"
          } >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ steps.deploy-config.outputs.deploy_ssh_key }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ steps.deploy-config.outputs.deploy_known_hosts }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload artifact and scripts
        shell: bash
        env:
          DEPLOY_HOST: ${{ steps.deploy-config.outputs.deploy_host }}
          DEPLOY_PORT: ${{ steps.deploy-config.outputs.deploy_port }}
          DEPLOY_USER: ${{ steps.deploy-config.outputs.deploy_user }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ARTIFACT_FILE=$(ls cnam-vms-*.tar.gz)
          SSH_OPTS="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

          ssh $SSH_OPTS -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /tmp/cnam-vms-deploy"

          scp $SSH_OPTS -P "$PORT" "$ARTIFACT_FILE" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cnam-vms-deploy/$ARTIFACT_FILE"
          scp $SSH_OPTS -P "$PORT" ops/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cnam-vms-deploy/deploy.sh"
          scp $SSH_OPTS -P "$PORT" ops/rollback.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/cnam-vms-deploy/rollback.sh"

      - name: Run remote deploy
        shell: bash
        env:
          DEPLOY_HOST: ${{ steps.deploy-config.outputs.deploy_host }}
          DEPLOY_PORT: ${{ steps.deploy-config.outputs.deploy_port }}
          DEPLOY_USER: ${{ steps.deploy-config.outputs.deploy_user }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ARTIFACT_FILE=$(ls cnam-vms-*.tar.gz)
          SSH_OPTS="-i ~/.ssh/deploy_key -o IdentitiesOnly=yes"

          ssh $SSH_OPTS -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "chmod +x /tmp/cnam-vms-deploy/deploy.sh /tmp/cnam-vms-deploy/rollback.sh && /tmp/cnam-vms-deploy/deploy.sh /tmp/cnam-vms-deploy/$ARTIFACT_FILE"
